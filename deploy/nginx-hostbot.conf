# Host bot admin page behind nginx, included inside the HTTPS server block:
#   include /etc/nginx/snippets/hostbot.conf;
# The bot enforces HTTP basic auth itself and listens on 127.0.0.1:8585 only.
location = /hostbot { return 301 /hostbot/; }
location /hostbot/ {
    # Only the lenient site-wide limit applies here; the admin page polls every few seconds.
    limit_req zone=ma_all2 burst=300 nodelay;
    access_log off;
    proxy_pass http://127.0.0.1:8585/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
